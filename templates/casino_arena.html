/* === CRICKNOVA VIP ENHANCED CASINO STYLES === */
:root {
  --gold-glow: rgba(245, 158, 11, 0.4);
  --green-glow: rgba(0, 231, 1, 0.45);
}
header {
  background: #080d14 !important;
  border-bottom: 1px solid rgba(255, 215, 0, 0.18) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important;
}
.brand-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: #fff;
}
.brand-badge {
  background: linear-gradient(135deg, #ef4444, #f59e0b);
  color: #fff;
  font-weight: 900;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}
.cricket-link {
  text-decoration: none;
  background: #1e293b;
  border: 1px solid #334155;
  color: #cbd5e1;
  font-size: 11.5px;
  padding: 5px 11px;
  border-radius: 7px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.15s ease;
}
.cricket-link:hover {
  border-color: #38bdf8;
  color: #fff;
  background: #0f172a;
}
.deposit-btn {
  background: linear-gradient(135deg, #00e701, #009624);
  color: #000 !important;
  font-weight: 900;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 8px;
  text-decoration: none;
  box-shadow: 0 2px 10px rgba(0,231,1,0.45);
  letter-spacing: 0.5px;
  display: inline-flex;
  align-items: center;
  transition: all 0.15s ease;
}
.deposit-btn:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}
.stake-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.quick-chip-bar {
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: wrap;
}
.chip-pill {
  padding: 5px 10px !important;
  font-size: 12px !important;
  font-weight: 800 !important;
  border-radius: 18px !important;
  border: 1.5px solid #334155 !important;
  background: #111827 !important;
  color: #cbd5e1 !important;
  cursor: pointer;
  transition: all 0.15s ease;
  line-height: 1 !important;
}
.chip-pill:hover {
  border-color: #ffd700 !important;
  color: #fff !important;
  transform: translateY(-1px);
}
.chip-pill.active {
  border-color: #ffd700 !important;
  background: radial-gradient(circle at 35% 35%, #f59e0b, #b45309) !important;
  color: #000 !important;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.65) !important;
  transform: scale(1.05);
}
.timed-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
#staked {
  color: #facc15;
  font-weight: 800;
  font-size: 13.5px;
  margin-right: 4px;
  background: rgba(0,0,0,0.3);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid rgba(250, 204, 21, 0.25);
}

/* Primary Play & Spin Button */
button.primary, button[data-act="go"] {
  background: linear-gradient(135deg, #00e701 0%, #009624 50%, #006414 100%) !important;
  color: #ffffff !important;
  border: 1.5px solid #7eff82 !important;
  font-weight: 900 !important;
  text-transform: uppercase !important;
  letter-spacing: 1px !important;
  padding: 0.72em 1.7em !important;
  border-radius: 11px !important;
  box-shadow: 0 4px 18px rgba(0, 231, 1, 0.45), inset 0 1px 0 rgba(255,255,255,0.4) !important;
  text-shadow: 0 1px 3px rgba(0,0,0,0.7) !important;
  cursor: pointer;
  transition: all 0.15s ease !important;
}
button.primary:hover:not(:disabled), button[data-act="go"]:hover:not(:disabled) {
  filter: brightness(1.2) !important;
  transform: translateY(-2px) scale(1.03) !important;
  box-shadow: 0 6px 26px rgba(0, 231, 1, 0.65) !important;
}
button.primary:active:not(:disabled), button[data-act="go"]:active:not(:disabled) {
  transform: translateY(1px) scale(0.97) !important;
}

/* Double Button */
button[data-act="double"] {
  background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%) !important;
  color: #ffffff !important;
  border: 1.5px solid #38bdf8 !important;
  font-weight: 800 !important;
  border-radius: 10px !important;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4) !important;
}
button[data-act="double"]:hover:not(:disabled) {
  filter: brightness(1.2) !important;
  transform: translateY(-1px) !important;
}

/* Undo Button */
button[data-act="undo"] {
  background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%) !important;
  color: #ffffff !important;
  border: 1.5px solid #fde047 !important;
  font-weight: 800 !important;
  border-radius: 10px !important;
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4) !important;
}

/* Clear Button */
button[data-act="clear"] {
  background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%) !important;
  color: #ffffff !important;
  border: 1.5px solid #fca5a5 !important;
  font-weight: 800 !important;
  border-radius: 10px !important;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4) !important;
}

/* Auto Button */
button[data-act="auto"] {
  background: linear-gradient(135deg, #8b5cf6 0%, #5b21b6 100%) !important;
  color: #ffffff !important;
  border: 1.5px solid #c4b5fd !important;
  font-weight: 800 !important;
  border-radius: 10px !important;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4) !important;
}

/* Back Button */
button[data-act="back"] {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
  color: #e2e8f0 !important;
  border: 1.5px solid #475569 !important;
  font-weight: 750 !important;
  border-radius: 8px !important;
  padding: 6px 14px !important;
}

/* Andar Bahar Choices */
.andar .choices button[data-bet="a0"], .andar .choices button[data-bet="a2"] {
  background: linear-gradient(135deg, #dc2626 0%, #881337 100%) !important;
  border: 2px solid #fca5a5 !important;
  color: #ffffff !important;
  font-weight: 900 !important;
  letter-spacing: 0.5px !important;
  box-shadow: 0 4px 16px rgba(220, 38, 38, 0.45) !important;
  font-size: 15px !important;
  border-radius: 10px !important;
}
.andar .choices button[data-bet="a1"], .andar .choices button[data-bet="a3"] {
  background: linear-gradient(135deg, #0284c7 0%, #0c4a6e 100%) !important;
  border: 2px solid #7dd3fc !important;
  color: #ffffff !important;
  font-weight: 900 !important;
  letter-spacing: 0.5px !important;
  box-shadow: 0 4px 16px rgba(2, 132, 199, 0.45) !important;
  font-size: 15px !important;
  border-radius: 10px !important;
}
.andar .bands button {
  background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%) !important;
  border: 1px solid #2dd4bf !important;
  color: #f0fdfa !important;
  font-weight: 800 !important;
  border-radius: 8px !important;
}

/* Roulette Grid */

function spin(){if(locked)return;const bonus=free>0,stake=bonus?freeStake:chip;if(!bonus&&wallet<stake){auto=false;sync();notify('Insufficient Wallet Balance');return}if(bonus)free--;else balance(-stake);locked=true;sync();grid=slotGrid(room);multiplier=multipliers[rng(multipliers.length)];paintSlot(true);const drums=[...d('play').querySelectorAll('.reel')];drums.forEach((drum,index)=>{const strip=drum.firstElementChild;drum.style.height=drum.getBoundingClientRect().height+'px';strip.insertAdjacentHTML('beforeend',strip.innerHTML);setTimeout(()=>{if(!drum.isConnected)return;drum.classList.remove('spin');tone(260+60*index,.07,'triangle')},580+index*110)});tone(room==='gold'?270:150,.25,'triangle');notify(bonus?'Free spin':'Reels spinning');later(()=>{paintSlot();let prize=slotPay(room,grid,multiplier,stake);if(!bonus&&room==='storm'&&grid.flat().filter(n=>n===6).length>=3){free+=3;freeStake=stake}balance(prize);locked=false;log((bonus?'Free · ':'')+money(prize));notify((prize?'Win '+money(prize):'Round complete')+(free?' · '+free+' free spins':''));tone(prize?780:280,.15);if(!bonus&&auto&&--autoLeft<=0)auto=false;sync();if(free||auto)later(spin,1100)},1250)}

function bingo(){if(locked)return;if(wallet<chip){notify('Insufficient Wallet Balance');return}locked=true;balance(-chip);sync();let draw=deck(90).slice(0,35).map(n=>n+1),k=0;function ball(){k++;paintBingo(draw.slice(0,k));tone(330+draw[k-1]*4,.045);notify('Ball '+k+' / 35');if(k<35){later(ball,155);return}const lines=tickets.flat().filter(r=>r.every(n=>draw.includes(n))).length,p=8*chip*lines;balance(p);log(lines+' lines · '+money(p));notify(lines+' complete lines · Return '+money(p));locked=false;sync()}ball()}

const bands=[3,4,5,6,10,16,25,50,130,800];function countBets(){return '<div class="sub">How many cards will be dealt?</div><div class="choices bands">'+bands.map((m,i)=>betButton('c'+i,(i*5+1)+'–'+Math.min(49,(i+1)*5)+' · '+m+'×')).join('')+'</div>'}function renderTable(){if(room==='wheel'){let nums=[];for(let r=3;r>0;r--)for(let n=r;n<=36;n+=3)nums.push(betButton('n'+n,n,red.has(n)?'red':'black'));d('play').innerHTML='<div class="split"><div class="roulette">'+rotor()+'</div><div>'+betButton('n0','0','green')+'<div class="grid">'+nums.join('')+'</div><div class="choices">'+['Red','Black','Odd','Even','1–18','19–36','1st 12','2nd 12','3rd 12','Column 1','Column 2','Column 3'].map((s,i)=>betButton('o'+i,s)).join('')+'</div></div></div>'}else{d('play').innerHTML='<div class="table"><small>Middle card</small><div>'+card(baseCard)+'</div><div class="lanes"><div class="lane">Andar<div id="a">—</div></div><div class="lane">Bahar<div id="b">—</div></div></div></div><div class="choices">'+['Andar · 2×','Bahar · 1.9×','First Andar · 17×','First Bahar · 16.5×'].map((s,i)=>betButton('a'+i,s)).join('')+'</div>'+countBets()}}
